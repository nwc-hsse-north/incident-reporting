.hero .fade{position:absolute;inset:0;background:linear-gradient(to right,rgba(27,42,92,0) 0%,rgba(27,42,92,.55) 30%,rgba(31,52,106,.97) 55%,#223a74 100%)}
body[dir=ltr] .hero .photo{left:auto;right:0}
body[dir=ltr] .hero .fade{background:linear-gradient(to left,rgba(27,42,92,0) 0%,rgba(27,42,92,.55) 30%,rgba(31,52,106,.97) 55%,#223a74 100%)}
.hero .in{position:relative;max-width:1180px;margin:0 auto;padding:28px 24px 64px;min-height:440px;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:84px;width:auto;display:block}
.langs{display:flex;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.1);padding:4px;border-radius:999px;backdrop-filter:blur(4px)}
.langs button{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:#fff;border-radius:999px;padding:5px 15px;cursor:pointer;line-height:1.6}
.langs button[aria-pressed=true]{background:#fff;color:var(--navy)}
.langs [data-l=en]{font-family:"Noto Sans",sans-serif}.langs [data-l=ur]{font-family:"Noto Naskh Arabic",serif}.langs [data-l=hi]{font-family:"Noto Sans Devanagari",sans-serif}.langs [data-l=ar]{font-family:"Noto Sans Arabic",sans-serif}
.htxt{margin-top:auto;max-width:640px;padding-top:40px}
.dept{font-size:16px;font-weight:600;color:#cfe7e3}
h1{font-size:clamp(28px,4.6vw,48px);line-height:1.35;font-weight:800;margin:10px 0 18px}
.gbar{width:90px;height:7px;border-radius:4px;background:var(--gold)}

/* EMERGENCY */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.emerg{position:relative;margin-top:-40px;display:flex;align-items:center;gap:22px;text-decoration:none;color:#fff;border-radius:22px;padding:22px 28px;background:linear-gradient(135deg,var(--red),var(--red-d));box-shadow:0 14px 36px rgba(168,38,30,.35);transition:transform .15s}
.emerg:hover{transform:translateY(-2px)}
.emerg .ic{flex:none;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.emerg .ic svg{width:36px;height:36px}
.emerg p{font-size:17px;font-weight:600;line-height:1.55}
.emerg b{display:block;font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:2px;line-height:1.2;margin-top:2px}
body[dir=rtl] .emerg b{text-align:right}
.emerg .cta{margin-inline-start:auto;flex:none;background:#fff;color:var(--red-d);font-weight:800;border-radius:999px;padding:10px 22px;font-size:16px}

/* INTRO + INFO */
.intro{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin:28px 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 24px}
.intro .card p{font-size:17px}
.doc{display:inline-block;background:var(--teal-l);color:#1d6b62;font-weight:700;border-radius:7px;padding:0 8px;font-size:15px;white-space:nowrap}
.info{display:flex;flex-direction:column;gap:12px}
.info > a{flex:1;padding:22px 24px}
.info > a .ii{width:56px;height:56px;border-radius:16px}
.info > a .ii svg{width:26px;height:26px}
.info > a small{font-size:14px}
.info > a strong{font-size:19px}
.info a,.info div{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.info .ii{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--navy);color:#fff}
.info .ii.g{background:var(--gold);color:var(--ink)}
.info .ii svg{width:22px;height:22px}
.info small{display:block;font-size:13px;color:var(--muted);font-weight:600;line-height:1.4}
.info strong{display:block;font-size:17px;color:var(--navy);line-height:1.5;overflow-wrap:anywhere}

/* SECTIONS */
.secs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:28px}
.sec{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.sec .sh{display:flex;align-items:center;gap:14px;padding:18px 24px;color:#fff}
.sec.s .sh{background:linear-gradient(135deg,var(--teal),#23706a)}
.sec.x .sh{background:linear-gradient(135deg,var(--navy-2),var(--deep))}
.sec .sh .ic{flex:none;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sec .sh .ic svg{width:26px;height:26px}
.sec .sh small{display:block;font-size:13px;opacity:.85;font-weight:700;line-height:1.3}
.sec h2{font-size:21px;line-height:1.45;font-weight:800}
.sec ol{list-style:none;counter-reset:n;padding:20px 24px 8px}
.sec li{counter-increment:n;position:relative;padding-inline-start:54px;padding-bottom:20px;font-size:16.5px}
.sec li::before{content:counter(n);position:absolute;inset-inline-start:0;top:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-family:"Noto Sans",sans-serif;font-weight:800;font-size:17px;color:#fff}
.sec.s li::before{background:var(--teal)}
.sec.x li::before{background:var(--navy)}
.sec li::after{content:"";position:absolute;inset-inline-start:18px;top:44px;bottom:6px;width:2px;background:var(--line)}
.sec li:last-child::after{display:none}
.hl{direction:ltr;unicode-bidi:isolate;display:inline-block;background:#fff4d6;color:#8a5a00;font-weight:700;border-radius:7px;padding:0 7px;font-family:"Noto Sans",sans-serif;font-size:14.5px;white-space:nowrap;text-decoration:none;line-height:1.7}
a.hl{background:var(--teal-l);color:#1d6b62}


/* EMERGENCY NUMBERS */
.nums{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 24px;margin-bottom:28px}
.nums h3{font-size:20px;font-weight:800;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.nums h3::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--red)}
.ng{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ng a{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.ng span{font-size:14.5px;font-weight:600;line-height:1.45}
.ng b{flex:none;font-family:"Noto Sans",sans-serif;font-size:22px;font-weight:800;color:var(--red)}
@media (max-width:860px){.ng{grid-template-columns:1fr 1fr}.nums{padding:18px}}
@media (max-width:380px){.ng{grid-template-columns:1fr}}
.emerg .ext{display:block;font-family:"Noto Sans",sans-serif;font-size:18px;font-weight:700;opacity:.95;margin-top:2px}
footer{background:var(--deep);color:#b8c4dc;margin-top:8px}
footer .in{max-width:1180px;margin:0 auto;padding:24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px}
footer img{height:54px}

@media (max-width:860px){
  .intro,.secs{grid-template-columns:1fr}
  .hero .photo{width:100%;opacity:.35}
  .hero .fade{background:linear-gradient(180deg,rgba(34,58,116,.55),#223a74 80%)!important}
  .hero .in{min-height:0;padding:20px 16px 60px}
  .logo{height:64px}
  .wrap{padding:0 16px}
  .emerg{padding:18px;gap:14px;flex-wrap:wrap}
  .emerg .ic{width:58px;height:58px}.emerg .ic svg{width:28px;height:28px}
  .emerg .cta{margin-inline-start:0;width:100%;text-align:center}
  .emerg p{font-size:15.5px}
  .card,.sec ol{padding-left:18px;padding-right:18px}
  .sec .sh{padding:16px 18px}
  .sec li{font-size:16.5px;padding-inline-start:50px}
}
</style>
</head>
<body>
<header class="hero">
  <div class="photo"></div><div class="fade"></div>
